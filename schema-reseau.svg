<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5a6b7d"/>
    </marker>
  </defs>

  <rect width="800" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">
    Architecture réseau – TP Active Directory TechNord SAS
  </text>

  <!-- Internal network boundary -->
  <rect x="60" y="70" width="680" height="320" rx="14" fill="#f4f7fb" stroke="#9bb4cc" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="80" y="98" font-size="14" font-weight="bold" fill="#5a6b7d">Réseau interne VirtualBox &#8211; LAN-TECHNORD</text>

  <!-- SRV-AD01 box -->
  <rect x="120" y="140" width="240" height="170" rx="10" fill="#e8f0fe" stroke="#3b6ea5" stroke-width="2"/>
  <text x="240" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2d3d">SRV-AD01</text>
  <text x="240" y="195" text-anchor="middle" font-size="12" fill="#3b4b5c">Windows Server 2022</text>
  <text x="240" y="215" text-anchor="middle" font-size="12" fill="#3b4b5c">Contrôleur de domaine + DNS</text>
  <text x="240" y="235" text-anchor="middle" font-size="12" fill="#3b4b5c">Domaine : technord.local</text>
  <line x1="145" y1="250" x2="335" y2="250" stroke="#c2d2e3" stroke-width="1"/>
  <text x="240" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">IP : 192.168.10.1</text>
  <text x="240" y="292" text-anchor="middle" font-size="12" fill="#3b4b5c">Masque : 255.255.255.0</text>

  <!-- PC-COMMERCIAL01 box -->
  <rect x="440" y="140" width="240" height="170" rx="10" fill="#eafaf0" stroke="#3a9162" stroke-width="2"/>
  <text x="560" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2d3d">PC-COMMERCIAL01</text>
  <text x="560" y="195" text-anchor="middle" font-size="12" fill="#3b4b5c">Windows 10 22H2</text>
  <text x="560" y="215" text-anchor="middle" font-size="12" fill="#3b4b5c">Poste client &#8211; membre du domaine</text>
  <text x="560" y="235" text-anchor="middle" font-size="12" fill="#3b4b5c">OU : TechNord / Postes</text>
  <line x1="465" y1="250" x2="655" y2="250" stroke="#c7e7d4" stroke-width="1"/>
  <text x="560" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6e44">IP : 192.168.10.10</text>
  <text x="560" y="292" text-anchor="middle" font-size="12" fill="#3b4b5c">DNS : 192.168.10.1 (SRV-AD01)</text>

  <!-- Link between the two -->
  <line x1="360" y1="225" x2="440" y2="225" stroke="#5a6b7d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="400" y="215" text-anchor="middle" font-size="11" fill="#5a6b7d">Authentification</text>
  <text x="400" y="246" text-anchor="middle" font-size="11" fill="#5a6b7d">DNS / GPO</text>

  <!-- Gateway -->
  <rect x="300" y="340" width="200" height="50" rx="8" fill="#fdf3e3" stroke="#c98a2b" stroke-width="2"/>
  <text x="400" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a14">Passerelle (non utilisée)</text>
  <text x="400" y="380" text-anchor="middle" font-size="12" fill="#8a5a14">192.168.10.254</text>

  <!-- Lines to gateway -->
  <line x1="240" y1="310" x2="350" y2="340" stroke="#c0c8d2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="560" y1="310" x2="450" y2="340" stroke="#c0c8d2" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Footer note -->
  <text x="400" y="430" text-anchor="middle" font-size="12" fill="#7a8a9a">
    Réseau interne isolé (pas d'accès Internet) &#8211; bascule temporaire en "Accès par pont" si besoin de télécharger
  </text>
</svg>
